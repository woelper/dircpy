on: [push]

name: Test Linux

jobs:
  check:
    name: Run Linux check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run cargo check
        uses: actions-rs/cargo@v1
        with:
          command: check
  test:
    name: Run WiLinuxndows tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run cargo tests
        uses: actions-rs/cargo@v1
        with:
          command: test
