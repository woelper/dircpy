on: [push]

name: Test Mac

jobs:
  check:
    name: Check OSX
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run cargo check
        uses: actions-rs/cargo@v1
        with:
          command: check
  test:
    name: Run OSX tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run cargo tests
        uses: actions-rs/cargo@v1
        with:
          command: test
