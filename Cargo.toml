[package]
name = "dircpy"
version = "0.3.20"
authors = ["Johann Woelper <woelper@gmail.com>"]
edition = "2021"
rust-version = "1.64"
license = "MIT"
description = "Copy directories recursively with flexible options."
repository = "https://github.com/woelper/dircpy/"
keywords = ["copy", "recursive", "filesystem", "file"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
# Deprecated and without effect. Kept so dependents enabling it still build.
jwalk = []

[dependencies]
walkdir = "2.5"
log = "0.4"
# rayon = "1.4.0"

[dev-dependencies]
unzip = "0.1"
reqwest = { version = "0.13", features = ["blocking"] }
env_logger = "0.11"
criterion = "0.5"

[[bench]]
name = "copy_rustlang"
harness = false
